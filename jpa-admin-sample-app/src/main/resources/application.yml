server:
  port: 8080

spring:
  application:
    name: jpa-admin-demo
  datasource:
    url: jdbc:h2:mem:admindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    admin:
      enabled: true
      path: /admin
      title: "Durgesh Admin Console"
      pageSize: 10
      export-enabled: true
      security:
        username: ${ADMIN_USERNAME:admin}
        password: ${ADMIN_PASSWORD:admin}

logging:
  level:
    io.github.jpaadmin: DEBUG
