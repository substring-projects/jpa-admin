server:
  port: 8080

spring:
  application:
    name: jpa-admin-demo
  datasource:
    url: jdbc:h2:mem:admindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    admin:
      enabled: true
      path: /admin
      title: "Substring Admin Console"
      page-size: 25
      primary-color: "#1E88E5"
      export-enabled: true
      security:
        mode: database
        # Local H2 sample only; use managed migrations in production.
        initialize-schema: true
        username: ${ADMIN_USERNAME:admin}
        password: ${ADMIN_PASSWORD:admin}

      # Where @AdminUpload fields store files. Fields without a storage name use "default".
      storage:
        default:
          type: local
          directory: ./uploads
          public-path: /uploads

        # Amazon S3 (add software.amazon.awssdk:s3 to the dependencies):
        # default:
        #   type: s3
        #   bucket: my-bucket
        #   region: ap-south-1
        #   access-key: ${AWS_ACCESS_KEY_ID}
        #   secret-key: ${AWS_SECRET_ACCESS_KEY}
        # ImageKit:
        # default:
        #   type: imagekit
        #   public-key: ${IMAGEKIT_PUBLIC_KEY}
        #   private-key: ${IMAGEKIT_PRIVATE_KEY}
        #   url-endpoint: https://ik.imagekit.io/your_id
      logo-url: "https://substringtechnologies.com/_next/static/media/substring_logo.e4bf633e.png"

logging:
  level:
    com.substringtechnologies.jpaadmin: DEBUG
