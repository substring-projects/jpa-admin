name: Build
on:
  push:
    branches: [main, 'develop/**', 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jpa-admin-ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: jpa-admin-ui
      - name: UI unit tests
        run: npm test
        working-directory: jpa-admin-ui
      # Builds the UI bundle, compiles for Java 17 and runs every module's tests.
      - name: Build and test
        run: ./mvnw -B -ntp install
      - name: Install browser
        if: matrix.java == '17'
        run: npx playwright install --with-deps chromium
        working-directory: jpa-admin-ui
      - name: End-to-end tests (configured security)
        if: matrix.java == '17'
        run: npx playwright test
        working-directory: jpa-admin-ui
      - name: End-to-end tests (database security)
        if: matrix.java == '17'
        env:
          E2E_SECURITY_MODE: database
          E2E_PORT: '8091'
        run: npx playwright test e2e/permissions.spec.ts e2e/security.spec.ts
        working-directory: jpa-admin-ui
      - name: Upload Playwright report
        if: failure() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: jpa-admin-ui/test-results
          retention-days: 7
