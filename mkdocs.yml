site_name: Spring Boot JPA Admin
site_description: Enterprise-grade auto-generated administration UI and REST API for Spring Boot applications.
site_url: https://substring-projects.github.io/jpa-admin/
repo_url: https://github.com/substring-projects/jpa-admin
repo_name: substring-projects/jpa-admin
edit_uri: edit/main/docs/
strict: true

hooks:
  - scripts/docs_hooks.py

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/database-cog
    repo: fontawesome/brands/github
  palette:
    # Classic Light Mode
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Deep Slate / Onyx Dark Mode
    - scheme: slate
      primary: slate
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.tailwindcss.com
  - javascripts/tailwind-config.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Overview: README.md
  - Get started:
      - Installation & JitPack: installation.md
      - Run the sample: getting-started.md
      - Configuration: configuration.md
  - Guides:
      - User guide: user-guide.md
      - Entity customization: entity-customization.md
      - Security & Auth: security.md
      - REST API Reference: api-reference.md
  - Operations:
      - Deployment: deployment.md
      - Troubleshooting: troubleshooting.md
      - Limitations & Roadmap: limitations.md
  - Contributors:
      - Architecture: architecture.md
      - Development: development.md
      - Release Guide: releasing.md
      - Documentation Website: publishing-docs.md
      - Contributing: https://github.com/substring-projects/jpa-admin/blob/main/CONTRIBUTING.md
